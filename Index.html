<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SCI FRIMONT</title><style>
:root{--navy:#0d2238;--cream:#f5f1ea;--ink:#172635;--muted:#6d7882;--line:#e4ded5;--green:#2e7b5d;--red:#bd3c3c;--amber:#b36b09}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:1100px;margin:auto;min-height:100vh}.top{background:var(--navy);color:white;padding:20px;position:sticky;top:0;z-index:4}.brand{font-weight:900;letter-spacing:.08em;font-size:21px}.tag{font-size:12px;opacity:.7;margin-top:3px}.main{padding:18px 14px 90px}.hero{background:var(--navy);color:white;border-radius:20px;padding:20px}.eyebrow{font-size:11px;letter-spacing:.12em;opacity:.65;font-weight:800}.hero h1{margin:5px 0 14px;font-size:27px}.big{font-size:34px;font-weight:900}.small{font-size:13px;color:var(--muted)}.hero .small{color:#c8d2dc}.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:15px}.mini div{background:#fff1;border-radius:12px;padding:10px}.mini b{font-size:17px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:15px;box-shadow:0 4px 16px #00000008}.metric{font-size:23px;font-weight:900;margin-top:3px}.good{color:var(--green)}.bad{color:var(--red)}.warn{color:var(--amber)}h1{font-size:25px;margin:0}h2{font-size:18px;margin:0 0 10px}.section{margin-top:20px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.list{display:grid;gap:10px}.pill{font-size:11px;font-weight:800;border-radius:99px;padding:5px 9px;display:inline-block}.pill.good{background:#e4f4eb}.pill.bad{background:#fde8e8}.pill.warn{background:#fff0d8}.property{display:flex;gap:12px;align-items:center}.house{width:58px;height:52px;border-radius:12px;background:#e7ddd0;display:grid;place-items:center;font-size:25px}.btn{border:0;border-radius:10px;padding:10px 13px;background:var(--navy);color:white;font-weight:800}.btn.alt{background:#eee9e2;color:var(--navy)}.btn.red{background:#fff0f0;color:var(--red)}.actions{display:flex;gap:8px;flex-wrap:wrap}.nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5}.nav button{border:0;background:none;padding:10px 13px;color:#6c7882;font-size:12px}.nav button.active{color:var(--navy);font-weight:900}.empty{text-align:center;padding:25px;color:var(--muted)}.toast{position:fixed;right:14px;bottom:75px;background:var(--navy);color:white;padding:12px 14px;border-radius:12px;z-index:20}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:16px;z-index:10}.modal>div{background:white;border-radius:18px;padding:18px;width:min(500px,100%)}.form{display:grid;gap:9px}.form label{font-size:12px;font-weight:800}.form input{padding:11px;border:1px solid #d8d0c6;border-radius:10px;width:100%}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.main{padding:14px 12px 88px}.nav button{padding:10px 8px}.card{padding:13px}}
</style></head><body><div id="app"></div><script>
const KEY="SCI_FRIMONT_V2";
const demo={properties:[
{id:1,name:"Appartement Laval 1",city:"Laval",surface:45,type:"T2",rent:780,charges:60,status:"Loué",tenant:"Locataire A",lease:"01/03/2023"},
{id:2,name:"Appartement Mayenne 2",city:"Mayenne",surface:62,type:"T3",rent:850,charges:70,status:"Loué",tenant:"Locataire B",lease:"15/06/2024"},
{id:3,name:"Appartement Laval 3",city:"Laval",surface:50,type:"T2",rent:720,charges:50,status:"Disponible",tenant:"",lease:""},
{id:4,name:"Appartement Château-Gontier 4",city:"Château-Gontier",surface:78,type:"T3",rent:900,charges:80,status:"Loué",tenant:"Locataire C",lease:"01/09/2022"}],
payments:[
{id:1,property:1,amount:780,status:"paid",month:"Septembre 2026"},
{id:2,property:2,amount:850,status:"paid",month:"Septembre 2026"},
{id:3,property:3,amount:720,status:"pending",month:"Septembre 2026"},
{id:4,property:4,amount:900,status:"late",month:"Septembre 2026"}],
expenses:[
{property:1,label:"Crédit",amount:520},{property:1,label:"Taxe foncière",amount:95},
{property:2,label:"Crédit",amount:560},{property:2,label:"Assurance",amount:32},
{property:3,label:"Travaux",amount:250},{property:4,label:"Crédit",amount:610}],
documents:[],reminders:[
{label:"Révision du loyer — Appartement Laval 1",date:"01/10/2026",type:"Loyer"},
{label:"Assurance — Appartement Mayenne 2",date:"12/10/2026",type:"Assurance"},
{label:"Fin de bail — Appartement Laval 3",date:"28/02/2027",type:"Bail"}]};
let d=JSON.parse(localStorage.getItem(KEY)||"null")||JSON.parse(JSON.stringify(demo)), page="home";
const eur=n=>new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(n);
const p=id=>d.properties.find(x=>x.id==id);
const save=()=>localStorage.setItem(KEY,JSON.stringify(d));
function nav(){return `<nav class="nav">${[["home","⌂","Accueil"],["properties","🏠","Biens"],["payments","€","Loyers"],["finance","▥","Finances"],["more","☰","Plus"]].map(x=>`<button class="${page==x[0]?"active":""}" onclick="go('${x[0]}')">${x[1]}<br>${x[2]}</button>`).join("")}</nav>`}
function render(){document.getElementById("app").innerHTML=`<div class="app"><header class="top"><div class="brand">SCI FRIMONT</div><div class="tag">Gestion de patrimoine immobilier</div></header><main class="main">${views[page]()}</main>${nav()}</div>`}
function cardMetric(a,b,c,cl=""){return `<div class="card"><div class="small">${a}</div><div class="metric ${cl}">${b}</div><div class="small">${c}</div></div>`}
const views={
home:()=>{let rent=d.properties.filter(x=>x.status=="Loué").reduce((s,x)=>s+x.rent,0),paid=d.payments.filter(x=>x.status=="paid").reduce((s,x)=>s+x.amount,0),due=d.payments.filter(x=>x.status!="paid").reduce((s,x)=>s+x.amount,0),late=d.payments.filter(x=>x.status=="late").length;return `<section class="hero"><div class="eyebrow">TABLEAU DE BORD</div><h1>Votre patrimoine</h1><div class="big">${eur(rent)}</div><div class="small">loyers mensuels des biens loués</div><div class="mini"><div><b>${d.properties.length}</b><br><span class="small">Logements</span></div><div><b>${eur(paid)}</b><br><span class="small">Encaissés</span></div><div><b>${eur(due)}</b><br><span class="small">À recevoir</span></div></div></section><div class="grid">${cardMetric("Biens",d.properties.length,"au total")}${cardMetric("Encaissé",eur(paid),"ce mois","good")}${cardMetric("À recevoir",eur(due),"ce mois","warn")}${cardMetric("Impayés",late,"à surveiller",late?"bad":"good")}</div><section class="section"><div class="row"><h2>À surveiller</h2><button class="btn alt" onclick="go('payments')">Voir les loyers</button></div><div class="list">${d.payments.filter(x=>x.status!="paid").map(x=>`<div class="card row"><div><b>${p(x.property)?.name||"Bien"}</b><div class="small">${x.month}</div></div><span class="pill ${x.status=="late"?"bad":"warn"}">${x.status=="late"?"Impayé":"En attente"} • ${eur(x.amount)}</span></div>`).join("")||`<div class="empty">Tout est à jour 🎉</div>`}</div></section>`},
properties:()=>`<div class="row"><div><h1>Mes logements</h1><div class="small">${d.properties.length} biens</div></div><button class="btn" onclick="addProperty()">+ Ajouter</button></div><div class="list section">${d.properties.map(x=>`<div class="card"><div class="property"><div class="house">🏠</div><div style="flex:1"><div class="row"><b>${x.name}</b><span class="pill ${x.status=="Loué"?"good":"warn"}">${x.status}</span></div><div class="small">${x.type} • ${x.surface} m² • ${x.city}</div><div style="margin-top:5px"><b>${eur(x.rent)}</b><span class="small"> + ${eur(x.charges)} charges</span></div></div></div><div class="actions" style="margin-top:10px"><button class="btn alt" onclick="details(${x.id})">Détails</button><button class="btn alt" onclick="editProperty(${x.id})">Modifier</button></div></div>`).join("")}</div>`,
payments:()=>`<div class="row"><div><h1>Loyers</h1><div class="small">Septembre 2026</div></div><button class="btn" onclick="addPayment()">+ Paiement</button></div><div class="grid">${cardMetric("Prévu",eur(d.properties.filter(x=>x.status=="Loué").reduce((s,x)=>s+x.rent,0)),"mensuel")}${cardMetric("Encaissé",eur(d.payments.filter(x=>x.status=="paid").reduce((s,x)=>s+x.amount,0)),"reçu","good")}${cardMetric("En attente",eur(d.payments.filter(x=>x.status=="pending").reduce((s,x)=>s+x.amount,0)),"à recevoir","warn")}${cardMetric("Impayés",eur(d.payments.filter(x=>x.status=="late").reduce((s,x)=>s+x.amount,0)),"à relancer","bad")}</div><div class="list section">${d.payments.map(x=>`<div class="card"><div class="row"><div><b>${p(x.property)?.name||"Bien"}</b><div class="small">${x.month} • ${p(x.property)?.tenant||"Sans locataire"}</div></div><div style="text-align:right"><b>${eur(x.amount)}</b><br><span class="pill ${x.status=="paid"?"good":x.status=="late"?"bad":"warn"}">${x.status=="paid"?"Payé":x.status=="late"?"Impayé":"En attente"}</span></div></div>${x.status!="paid"?`<div class="actions" style="margin-top:9px"><button class="btn" onclick="markPaid(${x.id})">Marquer payé</button></div>`:""}</div>`).join("")}</div>`,
finance:()=>{let rev=d.payments.filter(x=>x.status=="paid").reduce((s,x)=>s+x.amount,0), exp=d.expenses.reduce((s,x)=>s+x.amount,0);return `<h1>Finances</h1><div class="small">Vue globale du portefeuille</div><div class="grid">${cardMetric("Revenus",eur(rev),"encaissés","good")}${cardMetric("Dépenses",eur(exp),"suivies","bad")}${cardMetric("Résultat",eur(rev-exp),"sur les données saisies",rev-exp>=0?"good":"bad")}${cardMetric("Biens",d.properties.length,"dans le portefeuille")}</div><section class="section card"><h2>Dépenses</h2>${d.expenses.map(x=>`<div class="row" style="padding:9px 0;border-bottom:1px solid #eee"><span>${p(x.property)?.name||"Bien"} — ${x.label}</span><b>${eur(x.amount)}</b></div>`).join("")}</section><section class="section card"><h2>Documents et suivi</h2><div class="small">La version suivante pourra calculer automatiquement rentabilité brute/nette, cash-flow, crédit, taxe foncière et fiscalité.</div></section>`},
more:()=>`<h1>Plus</h1><div class="list section"><div class="card row"><div><b>📄 Documents</b><div class="small">${d.documents.length} document(s)</div></div><button class="btn alt" onclick="go('documents')">Ouvrir</button></div><div class="card row"><div><b>🔔 Rappels</b><div class="small">${d.reminders.length} échéance(s)</div></div><button class="btn alt" onclick="go('reminders')">Ouvrir</button></div><div class="card"><b>☁️ Multi-téléphones</b><p class="small">Prototype local actuellement. Pour partager les mêmes données entre téléphones, nous connecterons ensuite un compte et une base cloud sécurisée.</p><span class="pill warn">Prochaine étape</span></div><div class="card"><b>💾 Données de démonstration</b><div class="actions" style="margin-top:10px"><button class="btn alt" onclick="exportData()">Exporter</button><button class="btn red" onclick="resetData()">Réinitialiser</button></div></div></div>`,
documents:()=>`<div class="row"><div><h1>Documents</h1><div class="small">Baux, diagnostics, factures...</div></div><button class="btn" onclick="addDocument()">+ Ajouter</button></div><div class="list section">${d.documents.map((x,i)=>`<div class="card row"><div><b>📄 ${x.name}</b><div class="small">${p(x.property)?.name||"Portefeuille"}</div></div><button class="btn red" onclick="delDoc(${i})">Supprimer</button></div>`).join("")||`<div class="empty">Aucun document pour le moment.</div>`}</div>`,
reminders:()=>`<h1>Rappels</h1><div class="small">Prochaines échéances</div><div class="list section">${d.reminders.map(x=>`<div class="card row"><div><span class="pill warn">${x.type}</span><div style="margin-top:7px"><b>${x.label}</b></div></div><b>${x.date}</b></div>`).join("")}</div>`
};
function go(x){page=x;render()}
function toast(t){let x=document.createElement("div");x.className="toast";x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),1800)}
function addProperty(){let name=prompt("Nom du logement");if(!name)return;let city=prompt("Ville","Laval")||"",rent=Number(prompt("Loyer mensuel hors charges","800"))||800,surface=Number(prompt("Surface (m²)","50"))||50;d.properties.push({id:Date.now(),name,city,surface,type:prompt("Type","T2")||"T2",rent,charges:Number(prompt("Charges","60"))||0,status:"Loué",tenant:prompt("Locataire","")||"",lease:""});save();render();toast("Logement ajouté")}
function editProperty(id){let x=p(id);x.rent=Number(prompt("Loyer",x.rent))||x.rent;x.charges=Number(prompt("Charges",x.charges))||0;x.tenant=prompt("Locataire",x.tenant)||"";save();render();toast("Logement modifié")}
function details(id){let x=p(id);alert(`${x.name}\n${x.type} • ${x.surface} m² • ${x.city}\nLoyer : ${eur(x.rent)}\nCharges : ${eur(x.charges)}\nLocataire : ${x.tenant||"—"}\nBail : ${x.lease||"—"}`)}
function addPayment(){let x=d.properties.find(q=>q.status=="Loué");if(!x)return alert("Ajoute un logement loué.");let amount=Number(prompt("Montant du paiement",x.rent))||x.rent;d.payments.push({id:Date.now(),property:x.id,amount,status:"paid",month:"Septembre 2026"});save();render();toast("Paiement ajouté")}
function markPaid(id){let x=d.payments.find(q=>q.id==id);x.status="paid";save();render();toast("Paiement enregistré")}
function addDocument(){let name=prompt("Nom du document");if(!name)return;d.documents.push({name,property:d.properties[0]?.id});save();render();toast("Document ajouté")}
function delDoc(i){d.documents.splice(i,1);save();render()}
function exportData(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:"application/json"}));a.download="SCI_FRIMONT_donnees.json";a.click()}
function resetData(){if(confirm("Réinitialiser la démonstration ?")){d=JSON.parse(JSON.stringify(demo));save();render()}}
render();
</script></body></html>
